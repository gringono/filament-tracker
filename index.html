<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Filament-Tracker"/>
  <meta name="theme-color" content="#0d0d10"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="preload" href="./vendor/kaushan-script.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <title>Filament-Tracker</title>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <style>
    /* Titelschrift (Google Fonts, SIL Open Font License) – liegt lokal im Ordner vendor */
    @font-face{font-family:'Kaushan Script';src:url('./vendor/kaushan-script.woff2') format('woff2');font-display:swap;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;background:#08080a;color:#f4f4f5;font-family:'Inter',system-ui,-apple-system,sans-serif;overscroll-behavior:none;overflow-x:hidden;width:100%;max-width:100%;-webkit-font-smoothing:antialiased;}
    /* clip statt hidden: schneidet seitlich ab, macht body aber nicht zu einem eigenen
       Scrollbereich – sonst scrollt am PC das Mausrad nicht (overscroll-behavior:none) */
    body{overflow-x:clip;}
    #root{width:100%;min-height:100vh;}
    img,svg,video,canvas{max-width:100%;}
    /* min-width:0: Eingabefelder dürfen in Zeilen schrumpfen, sonst wird die Seite breiter als das Handy */
    input,select,textarea{max-width:100%;min-width:0;}
    input,select,button,textarea{font-family:inherit;}
    input[type=number]::-webkit-inner-spin-button{opacity:1;}
    ::-webkit-scrollbar{width:4px;height:0;}
    ::-webkit-scrollbar-track{background:#0d0d10;}
    ::-webkit-scrollbar-thumb{background:#2a2a31;border-radius:2px;}
    select option{background:#17171b;color:#f4f4f5;}
    input:focus,select:focus,textarea:focus{border-color:#52525b !important;}
    @keyframes tippWelle{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
    /* Startanzeige – wird von der App ersetzt, sobald sie läuft */
    #start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
    #start .titel{font-family:'Kaushan Script',cursive;font-size:40px;color:#fff}
    #start .titel span{color:#fb923c}
    #start .info{font-size:14px;color:#a1a1aa;line-height:1.5;max-width:300px}
    #start button{margin-top:8px;width:240px;background:#f4f4f5;color:#0d0d10;border:none;border-radius:14px;padding:13px 0;font-weight:700;font-size:15px}
    #start .fehler{font:12px ui-monospace,Menlo,monospace;color:#fb7185;max-width:300px;word-break:break-word}
  </style>
  <script>
    // Start-Wächter: Läuft die App nach 8 s noch nicht (Server nicht erreichbar, Skriptfehler),
    // statt eines dunklen Bildschirms einen Knopf zum Neuladen zeigen.
    window.__startFehler = "";
    window.addEventListener("error", function (e) { if (!window.__appLaeuft) window.__startFehler = e.message || String(e); });
    setTimeout(function () {
      if (window.__appLaeuft) return;
      var s = document.getElementById("start");
      if (!s) return;
      s.querySelector(".info").textContent = "Die App startet nicht. Ist das iPhone im Heim-WLAN?";
      var b = document.createElement("button");
      b.textContent = "Neu laden";
      b.onclick = function () { location.reload(); };
      s.appendChild(b);
      if (window.__startFehler) {
        var f = document.createElement("div");
        f.className = "fehler";
        f.textContent = window.__startFehler;
        s.appendChild(f);
      }
    }, 8000);

    // Aufwachen: iOS-Home-Bildschirm-Apps bleiben nach dem Standby manchmal schwarz,
    // obwohl die Seite noch läuft. Darum beim Zurückkommen neu zeichnen und nach
    // längerer Pause (10 min) einmal komplett neu laden.
    window.__verstecktSeit = 0;
    function neuZeichnen() {
      var b = document.body;
      if (!b) return;
      b.style.display = "none";
      void b.offsetHeight;
      b.style.display = "";
      window.dispatchEvent(new Event("resize"));
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") { window.__verstecktSeit = Date.now(); return; }
      if (window.__verstecktSeit && Date.now() - window.__verstecktSeit > 10 * 60 * 1000) { location.reload(); return; }
      neuZeichnen();
    });
    window.addEventListener("pageshow", function (e) { if (e.persisted) neuZeichnen(); });
  </script>
</head>
<body>
<div id="root"><div id="start"><div class="titel">Filament <span>Tracker</span></div><div class="info">lädt …</div></div></div>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./app.js?v=7.22"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js");}</script>
</body>
</html>
