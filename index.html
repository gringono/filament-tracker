<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Filament-Tracker"/>
  <meta name="theme-color" content="#0d0d10"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="preload" href="./vendor/kaushan-script.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <title>Filament-Tracker</title>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <style>
    /* Titelschrift (Google Fonts, SIL Open Font License) – liegt lokal im Ordner vendor */
    @font-face{font-family:'Kaushan Script';src:url('./vendor/kaushan-script.woff2') format('woff2');font-display:swap;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;background:#08080a;color:#f4f4f5;font-family:'Inter',system-ui,-apple-system,sans-serif;overscroll-behavior:none;overflow-x:hidden;width:100%;max-width:100%;-webkit-font-smoothing:antialiased;}
    /* clip statt hidden: schneidet seitlich ab, macht body aber nicht zu einem eigenen
       Scrollbereich – sonst scrollt am PC das Mausrad nicht (overscroll-behavior:none) */
    body{overflow-x:clip;}
    #root{width:100%;min-height:100vh;}
    img,svg,video,canvas{max-width:100%;}
    /* min-width:0: Eingabefelder dürfen in Zeilen schrumpfen, sonst wird die Seite breiter als das Handy */
    input,select,textarea{max-width:100%;min-width:0;}
    input,select,button,textarea{font-family:inherit;}
    input[type=number]::-webkit-inner-spin-button{opacity:1;}
    ::-webkit-scrollbar{width:4px;height:0;}
    ::-webkit-scrollbar-track{background:#0d0d10;}
    ::-webkit-scrollbar-thumb{background:#2a2a31;border-radius:2px;}
    select option{background:#17171b;color:#f4f4f5;}
    input:focus,select:focus,textarea:focus{border-color:#52525b !important;}
  </style>
</head>
<body>
<div id="root"></div>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./app.js?v=7.16"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js");}</script>
</body>
</html>
